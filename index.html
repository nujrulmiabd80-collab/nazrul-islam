<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বিকাশ ম্যানুয়াল পেমেন্ট</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .payment-card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    .bkash-header {
      background-color: #e2136e;
      color: white;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .instructions {
      background-color: #fff0f5;
      border-left: 4px solid #e2136e;
      padding: 10px 12px;
      font-size: 13px;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #444;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-submit {
      width: 100%;
      background-color: #e2136e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #c10d5d;
    }
  </style>
</head>
<body>

<div class="payment-card">
  <div class="bkash-header">
    বিকাশ ম্যানুয়াল পেমেন্ট
  </div>

  <div class="instructions">
    <b>নির্দেশনা:</b> আমাদের বিকাশ পার্সোনাল নম্বর <b>01700000000</b>-এ "Send Money" করুন। টাকা পাঠানোর পর নিচের ফর্মে বিবরণ দিয়ে জমা দিন।
  </div>

  <form action="#" method="POST">
    <div class="form-group">
      <label for="member_id">সদস্য আইডি (Member ID)</label>
      <input type="text" id="member_id" name="member_id" placeholder="যেমন: M-1024" required>
    </div>

    <div class="form-group">
      <label for="account_type">জমার খাত (Account Type)</label>
      <select id="account_type" name="account_type" required>
        <option value="">খাত নির্বাচন করুন</option>
        <option value="savings">সাধারণ সঞ্চয়</option>
        <option value="dps">ডিপিএস (DPS)</option>
        <option value="fdr">এফডিআর (FDR)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="amount">টাকার পরিমাণ (Amount)</label>
      <input type="number" id="amount" name="amount" placeholder="৳ ০.০০" required>
    </div>

    <div class="form-group">
      <label for="bkash_number">যে নম্বর থেকে টাকা পাঠিয়েছেন</label>
      <input type="tel" id="bkash_number" name="bkash_number" placeholder="017XXXXXXXX" required>
    </div>

    <div class="form-group">
      <label for="trx_id">বিকাশ Transaction ID (TrxID)</label>
      <input type="text" id="trx_id" name="trx_id" placeholder="যেমন: 9J76A4KL9X" required>
    </div>

    <button type="submit" class="btn-submit">পেমেন্ট তথ্য জমা দিন</button>
  </form>
</div>

</body>
</html>
